<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warmly Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    background: #0a0508;
    color: #fff;
    overflow: hidden;
  }

  #frame-wrap {
    position: absolute;
    inset: 0;
    background: #0a0508;
  }

  #frame {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
    display: block;
  }

  #bar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(440px, calc(100vw - 28px));
    padding: 5px 5px 5px 16px;
    background: rgba(15, 6, 10, 0.55);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    box-shadow:
      0 12px 40px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(236, 72, 153, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    opacity: 0.7;
    transition: opacity 0.35s ease, border-color 0.35s ease, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #bar:hover,
  #bar:focus-within {
    opacity: 1;
    border-color: rgba(236, 72, 153, 0.35);
  }
  #bar.idle-empty { opacity: 1; }
  #bar.hidden {
    transform: translateX(-50%) translateY(-200%);
    opacity: 0;
    pointer-events: none;
  }

  /* Hot zone at top of viewport — mouse here brings the bar back */
  #hot-zone {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    z-index: 9998;
    pointer-events: auto;
  }

  /* Tiny ghost indicator when bar is hidden — barely visible reminder */
  #ghost {
    position: fixed;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 3px;
    border-radius: 2px;
    background: rgba(236, 72, 153, 0.35);
    z-index: 9997;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  body.bar-hidden #ghost { opacity: 1; }
  body.bar-hidden #hot-zone:hover ~ #ghost { opacity: 0.8; }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ec4899;
    box-shadow: 0 0 10px rgba(236, 72, 153, 0.7), 0 0 18px rgba(236, 72, 153, 0.3);
    flex-shrink: 0;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.8); }
  }

  #f {
    display: flex;
    flex: 1;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  #d {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: #fff;
    padding: 6px 0;
    font-size: 13px;
    font-family: inherit;
    font-weight: 400;
    outline: none;
    letter-spacing: 0.2px;
  }
  #d::placeholder {
    color: rgba(255, 255, 255, 0.32);
    font-weight: 300;
  }

  #f button {
    background: rgba(236, 72, 153, 0.12);
    border: 1px solid rgba(236, 72, 153, 0.25);
    color: #ec4899;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #f button:hover {
    background: #ec4899;
    color: #fff;
    border-color: #ec4899;
    box-shadow: 0 0 14px rgba(236, 72, 153, 0.55);
  }
  #f button svg {
    width: 11px;
    height: 11px;
  }

  .fire-btns {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-shrink: 0;
    padding-right: 8px;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    margin-right: 4px;
  }
  .fire-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.65);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: all 0.2s ease;
    position: relative;
  }
  .fire-btn:hover {
    border-color: rgba(236, 72, 153, 0.6);
    color: #ec4899;
    background: rgba(236, 72, 153, 0.08);
  }
  .fire-btn.fired {
    background: rgba(236, 72, 153, 0.18);
    border-color: rgba(236, 72, 153, 0.55);
    color: #ec4899;
    box-shadow: 0 0 8px rgba(236, 72, 153, 0.35);
  }
  .fire-btn svg { width: 12px; height: 12px; }
  .fire-btn::after {
    content: attr(data-label);
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 6, 10, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.85);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.4px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    text-transform: uppercase;
  }
  .fire-btn:hover::after { opacity: 1; }

  #hide-btn {
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.35);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0;
    margin-right: 2px;
    transition: color 0.2s ease, background 0.2s ease;
  }
  #hide-btn:hover {
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.08);
  }
  #hide-btn svg { width: 10px; height: 10px; }

  #placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.35);
    font-size: 13px;
    gap: 6px;
    pointer-events: none;
    text-align: center;
    padding: 24px;
    font-weight: 300;
    letter-spacing: 0.4px;
  }
  #placeholder.hidden { display: none; }
  #placeholder .hint {
    font-size: 11px;
    opacity: 0.5;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ─── Login screen ────────────────────────────────────────────────── */
  #login {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a0a14 0%, #0a0508 60%, #050203 100%);
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #login.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #login::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .login-card {
    position: relative;
    z-index: 1;
    width: min(380px, calc(100vw - 32px));
    padding: 36px 32px 28px;
    background: rgba(15, 6, 10, 0.7);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .login-mark {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .login-mark .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ec4899;
    box-shadow: 0 0 10px rgba(236, 72, 153, 0.7), 0 0 18px rgba(236, 72, 153, 0.3);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .login-mark .label {
    font-size: 11px;
    font-weight: 500;
    color: #ec4899;
    letter-spacing: 1.6px;
  }
  .login-card h1 {
    font-size: 22px;
    font-weight: 400;
    color: #fff;
    margin-bottom: 4px;
    letter-spacing: -0.2px;
  }
  .login-card p.sub {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
    font-weight: 300;
    margin-bottom: 24px;
    letter-spacing: 0.2px;
  }
  #login-form { display: flex; flex-direction: column; gap: 12px; }
  #login-input {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 400;
    outline: none;
    letter-spacing: 0.2px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  #login-input:focus {
    border-color: rgba(236, 72, 153, 0.5);
    background: rgba(255, 255, 255, 0.06);
  }
  #login-input::placeholder { color: rgba(255, 255, 255, 0.3); font-weight: 300; }
  #login-submit {
    background: #ec4899;
    color: #fff;
    border: none;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  #login-submit:hover {
    background: #f97316;
    box-shadow: 0 0 24px rgba(236, 72, 153, 0.4);
  }
  #login-error {
    color: #ef4444;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.3px;
    margin-top: 4px;
    min-height: 14px;
  }

  /* ─── User pill in bar ────────────────────────────────────────────── */
  #user-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 4px;
    height: 22px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.7);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    flex-shrink: 0;
  }
  #user-pill:hover {
    background: rgba(236, 72, 153, 0.1);
    border-color: rgba(236, 72, 153, 0.3);
    color: #fff;
  }
  #user-pill .avatar {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ec4899, #f97316);
    color: #fff;
    font-size: 9px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
    letter-spacing: 0;
  }
</style>
</head>
<body>
  <div id="login">
    <div class="login-card">
      <div class="login-mark">
        <div class="dot"></div>
        <div class="label">WARMLY DEMO</div>
      </div>
      <h1>Sign in</h1>
      <p class="sub">Enter your work email to load your demo workspace.</p>
      <form id="login-form">
        <input id="login-input" type="email" placeholder="you@warmly.ai" autocomplete="email" autofocus spellcheck="false" />
        <button id="login-submit" type="submit">Continue</button>
        <div id="login-error" aria-live="polite"></div>
      </form>
    </div>
  </div>
  <div id="frame-wrap">
    <div id="placeholder">
      <div>Enter a domain</div>
      <div class="hint">The Warmly widget will load on their site</div>
    </div>
    <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
  </div>
  <div id="bar" class="idle-empty">
    <div class="dot"></div>
    <div class="fire-btns">
      <button id="btn-warmly" class="fire-btn" type="button" data-label="Warmly Chat" aria-label="Fire Warmly chat">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5C2.5 4.5 4 3 6 3h4c2 0 3.5 1.5 3.5 3.5V9c0 2-1.5 3.5-3.5 3.5H7l-3 2.5v-2.6c-1-.3-1.5-1.4-1.5-2.4V6.5z"/></svg>
      </button>
      <button id="btn-upvert" class="fire-btn" type="button" data-label="Upvert Popup" aria-label="Fire Upvert popup">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><path d="M5 6.5h6M5 9h4"/></svg>
      </button>
      <button id="user-pill" type="button" title="Click to sign out">
        <span class="avatar" id="user-avatar"></span>
        <span id="user-name"></span>
      </button>
    </div>
    <form id="f">
      <input id="d" type="text" placeholder="acme.com" autocomplete="off" autofocus spellcheck="false" />
      <button type="submit" aria-label="Load">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </button>
    </form>
    <button id="hide-btn" type="button" aria-label="Hide controls" title="Hide (\)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10l4-4 4 4"/></svg>
    </button>
  </div>
  <div id="hot-zone" aria-hidden="true"></div>
  <div id="ghost" aria-hidden="true"></div>
<script>
  const WORKER = 'https://warmly-demo-spoof.kwarmly.workers.dev';

  const params = new URLSearchParams(location.search);
  const initial = params.get('site');
  const bar = document.getElementById('bar');
  const f = document.getElementById('f');
  const d = document.getElementById('d');
  const frame = document.getElementById('frame');
  const placeholder = document.getElementById('placeholder');
  const hideBtn = document.getElementById('hide-btn');
  const hotZone = document.getElementById('hot-zone');

  // ─── User workspace config ──────────────────────────────────────────
  // To add a teammate: add their email + the two script URLs from their
  // Warmly Script Setup page and their Upvert site loader.js URL.
  const USERS = {
    'keanen@warmly.ai': {
      name: 'Keanen',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=e46b6961c27fa5afcf0a9eb0a157542e',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'ryan@warmly.ai': {
      name: 'Ryan',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=684ef64015d8dfe095656abc390a2d60',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'keegan@warmly.ai': {
      name: 'Keegan',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=b9b890179006f5f84bbb31da5dc96c3c',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'gabrielle@warmly.ai': {
      name: 'Gabrielle',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=56cd6efa90d8699432232fe9fc536e1c',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'tyler@warmly.ai': {
      name: 'Tyler',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=3f0e775c8e5e9a0a9ae4742ee13d9a21',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'matt@warmly.ai': {
      name: 'Matt',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=3f0220eb9876e5ba524ca6c9b74e5d52',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'ivona@warmly.ai': {
      name: 'Ivona',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=a0ed9390e7e869e135ec67ff076f9b9c',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'nick.gilbert@warmly.ai': {
      name: 'Nick',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=0f2a493e26ea657472fa6a14d3d35f43',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'chelsea@warmly.ai': {
      name: 'Chelsea',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=fa58de4b7aa14b4810350e0db12295e9',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'blake@warmly.ai': {
      name: 'Blake',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=e934fae40401a68969ecfd64fc955d1f',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'kelly@warmly.ai': {
      name: 'Kelly',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=c7b0a8d0d676c76a3ca5193cdf4b99ae',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'leland@warmly.ai': {
      name: 'Leland',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=5c20839edc1094e9fca963d717957276',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
    'lauren@warmly.ai': {
      name: 'Lauren',
      warmlyScript: 'https://opps-widget.getwarmly.com/warmly.js?clientId=dd56f8050e58587e8b989b3d03844ed4',
      upvertScript: 'https://cdn.upvertcdn.io/9FXRis36u4R30H5fddFM8lPKNo2vMkyh/loader.js',
    },
  };

  const STORAGE_KEY = 'warmly-demo-user';
  const loginEl = document.getElementById('login');
  const loginForm = document.getElementById('login-form');
  const loginInput = document.getElementById('login-input');
  const loginError = document.getElementById('login-error');
  const userPill = document.getElementById('user-pill');
  const userAvatar = document.getElementById('user-avatar');
  const userName = document.getElementById('user-name');

  let currentUser = null; // { email, ...USERS[email] }

  function login(email) {
    const normalized = email.trim().toLowerCase();
    const cfg = USERS[normalized];
    if (!cfg) {
      loginError.textContent = 'Email not configured. Ask Keanen to add you.';
      return false;
    }
    currentUser = { email: normalized, ...cfg };
    localStorage.setItem(STORAGE_KEY, normalized);
    userName.textContent = cfg.name;
    userAvatar.textContent = cfg.name.charAt(0);
    loginEl.classList.add('hidden');
    return true;
  }

  function logout() {
    localStorage.removeItem(STORAGE_KEY);
    currentUser = null;
    // Reload to fully reset widget state (vendor scripts persist once loaded)
    location.reload();
  }

  loginForm.addEventListener('submit', e => {
    e.preventDefault();
    loginError.textContent = '';
    login(loginInput.value);
  });
  userPill.addEventListener('click', logout);

  // Auto-login if previously authenticated
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved && USERS[saved]) {
    login(saved);
  } else if (saved) {
    // Saved email no longer in USERS — clear it
    localStorage.removeItem(STORAGE_KEY);
  }

  // ─── Manual widget firing ───────────────────────────────────────────
  // Scripts load in this shell's origin so they're untouched by whatever
  // site is in the iframe. Each fires once per session (per user).
  function fireWidget(key) {
    if (!currentUser) return;
    const btn = document.getElementById('btn-' + key);
    if (btn.classList.contains('fired')) return;
    const src = key === 'warmly' ? currentUser.warmlyScript : currentUser.upvertScript;
    if (!src) return;
    const s = document.createElement('script');
    s.src = src;
    s.id = key + '-script-loader';
    if (key === 'warmly') s.id = 'warmly-script-loader'; // Warmly checks this id
    document.head.appendChild(s);
    btn.classList.add('fired');
  }
  document.getElementById('btn-warmly').addEventListener('click', () => fireWidget('warmly'));
  document.getElementById('btn-upvert').addEventListener('click', () => fireWidget('upvert'));

  function clean(input) {
    return input.trim().replace(/^https?:\/\//, '').replace(/\/$/, '');
  }

  function load(domain) {
    const c = clean(domain);
    if (!c) return;
    frame.src = WORKER + '/?url=' + encodeURIComponent('https://' + c);
    d.value = c;
    placeholder.classList.add('hidden');
    bar.classList.remove('idle-empty');
  }

  function setHidden(hidden) {
    bar.classList.toggle('hidden', hidden);
    document.body.classList.toggle('bar-hidden', hidden);
    if (hidden && document.activeElement === d) d.blur();
  }

  f.addEventListener('submit', function(e) {
    e.preventDefault();
    const c = clean(d.value);
    if (!c) return;
    history.replaceState(null, '', '?site=' + encodeURIComponent(c));
    load(c);
  });

  hideBtn.addEventListener('click', function() { setHidden(true); });

  // Reveal: mouse to top edge
  hotZone.addEventListener('mouseenter', function() {
    if (bar.classList.contains('hidden')) setHidden(false);
  });

  // Toggle: backslash key
  document.addEventListener('keydown', function(e) {
    if (e.key === '\\') {
      e.preventDefault();
      setHidden(!bar.classList.contains('hidden'));
    } else if (e.key === 'Escape' && !bar.classList.contains('hidden')) {
      setHidden(true);
    }
  });

  if (initial) load(initial);
</script>
</body>
</html>
